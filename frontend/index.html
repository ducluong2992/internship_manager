<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý Thực tập sinh | Viettel</title>
  <meta name="description"
    content="Hệ thống quản lý thực tập sinh nội bộ Viettel – đăng ký lịch, quản lý hồ sơ và theo dõi tiến độ thực tập." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="static/style.css?v=1.5" rel="stylesheet" />
</head>

<body>

  <!-- ═══════════════════════ LOGIN PAGE ═══════════════════════ -->
  <div id="page-login" class="page active">
    <div class="login-bg">
      <div class="login-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
      </div>
      <div class="login-card glass-card">
        <div class="login-logo">
          <div class="logo-icon"><i class="bi bi-building-fill-gear"></i></div>
          <div>
            <h1 class="login-title">Viettel Intern</h1>
            <p class="login-subtitle">Hệ thống quản lý thực tập sinh</p>
          </div>
        </div>
        <form id="form-login" autocomplete="off">
          <div class="mb-4">
            <label class="form-label fw-semibold">Tên đăng nhập</label>
            <div class="input-icon-wrap">
              <i class="bi bi-person-fill input-icon"></i>
              <input id="login-code" type="text" class="form-control input-with-icon" placeholder="Nhập tên đăng nhập"
                required />
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Mật khẩu</label>
            <div class="input-icon-wrap">
              <i class="bi bi-lock-fill input-icon"></i>
              <input id="login-pass" type="password" class="form-control input-with-icon" placeholder="Nhập mật khẩu"
                required />
              <button type="button" class="btn-eye" onclick="togglePass('login-pass',this)"><i
                  class="bi bi-eye"></i></button>
            </div>
          </div>
          <div id="login-error" class="alert alert-danger d-none py-2 small"></div>
          <button type="submit" class="btn btn-primary btn-login w-100">
            <span class="btn-text"><i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập</span>
            <span class="btn-spinner d-none"><span class="spinner-border spinner-border-sm"></span></span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════ MAIN APP ═══════════════════════ -->
  <div id="page-app" class="page">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <i class="bi bi-building-fill-gear"></i>
          <span class="sidebar-brand">Viettel Intern</span>
        </div>
        <button class="sidebar-toggle-btn" id="sidebar-toggle"><i class="bi bi-list"></i></button>
      </div>

      <div class="sidebar-user">
        <div class="user-avatar"><i class="bi bi-person-circle"></i></div>
        <div class="user-info">
          <div class="user-name" id="sidebar-name">—</div>
          <div class="user-role" id="sidebar-role">—</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <!-- Admin menu -->
        <div id="admin-menu" class="d-none">
          <div class="nav-section-label">Quản trị</div>
          <a href="#" class="nav-item" data-page="dashboard" id="nav-dashboard">
            <i class="bi bi-speedometer2"></i><span>Dashboard</span>
          </a>
          <a href="#" class="nav-item" data-page="manage-users" id="nav-manage-users">
            <i class="bi bi-people-fill"></i><span>Thực tập sinh</span>
          </a>
          <a href="#" class="nav-item" data-page="manage-periods" id="nav-manage-periods">
            <i class="bi bi-calendar3"></i><span>Kỳ đăng ký</span>
          </a>
          <a href="#" class="nav-item" data-page="manage-accounts" id="nav-manage-accounts">
            <i class="bi bi-person-lines-fill"></i><span>Tài khoản đăng nhập</span>
          </a>
          <a href="#" class="nav-item" data-page="admin-schedule" id="nav-admin-schedule">
            <i class="bi bi-table"></i><span>Bảng lịch</span>
          </a>
        </div>

        <!-- Intern menu -->
        <div id="intern-menu" class="d-none">
          <div class="nav-section-label">Cá nhân</div>
          <a href="#" class="nav-item" data-page="profile" id="nav-profile">
            <i class="bi bi-person-badge-fill"></i><span>Hồ sơ cá nhân</span>
          </a>
          <a href="#" class="nav-item" data-page="register-schedule" id="nav-register-schedule">
            <i class="bi bi-calendar-check-fill"></i><span>Đăng ký lịch</span>
          </a>
          <a href="#" class="nav-item" data-page="view-schedule" id="nav-view-schedule">
            <i class="bi bi-calendar-week-fill"></i><span>Xem lịch</span>
          </a>
        </div>

        <div class="nav-divider"></div>
        <div class="nav-section-label">Tài khoản</div>
        <a href="#" class="nav-item" data-page="change-password" id="nav-change-password">
          <i class="bi bi-key-fill"></i><span>Đổi mật khẩu</span>
        </a>
        <a href="#" class="nav-item text-danger-nav" id="nav-logout">
          <i class="bi bi-box-arrow-left"></i><span>Đăng xuất</span>
        </a>
      </nav>
    </aside>

    <!-- Main content -->
    <div class="main-content" id="main-content">
      <div class="topbar">
        <button class="topbar-toggle" id="topbar-toggle"><i class="bi bi-list"></i></button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-right">
          <span class="topbar-clock" id="topbar-clock"></span>
        </div>
      </div>

      <div class="content-area" id="content-area">
        <!-- Pages rendered here by JS -->
      </div>
    </div>
  </div>

  <!-- ═══════════════════════ MODALS ═══════════════════════ -->

  <!-- User Modal -->
  <div class="modal fade" id="modal-user" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content glass-modal">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-user-title">Thêm thực tập sinh</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-user">
            <input type="hidden" id="user-id" />
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Mã nhân viên *</label>
                <input id="u-code" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Họ và tên *</label>
                <input id="u-name" class="form-control" required />
              </div>
              <div class="col-md-6 d-none">
                <label class="form-label">Mật khẩu <small class="text-muted">(để trống khi sửa)</small></label>
                <input id="u-pass" type="password" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Vai trò</label>
                <select id="u-role" class="form-select">
                  <option value="intern">Thực tập sinh</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Giới tính</label>
                <select id="u-gender" class="form-select">
                  <option value="">-- Chọn --</option>
                  <option>Nam</option>
                  <option>Nữ</option>
                  <option>Khác</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Ngày sinh</label>
                <input id="u-birthday" type="date" class="form-control" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Dân tộc</label>
                <input id="u-ethnicity" class="form-control" placeholder="Kinh, Tày..." />
              </div>
              <div class="col-md-6">
                <label class="form-label">Email Viettel</label>
                <input id="u-viettel-email" type="email" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Số điện thoại</label>
                <input id="u-phone" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">CCCD</label>
                <input id="u-cccd" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Quê quán</label>
                <input id="u-hometown" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Ngân hàng</label>
                <input id="u-bank-name" class="form-control" placeholder="Vietcombank, BIDV..." />
              </div>
              <div class="col-md-6">
                <label class="form-label">Số tài khoản</label>
                <input id="u-bank-account" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Dự án</label>
                <input id="u-project" class="form-control" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Trợ cấp (VNĐ)</label>
                <input id="u-allowance" type="number" class="form-control" value="0" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Loại nhân sự</label>
                <select id="u-emp-type" class="form-select">
                  <option value="Intern">Thực tập</option>
                  <option value="Borrowed">Đi mượn</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Trạng thái làm việc</label>
                <select id="u-work-status" class="form-select">
                  <option value="Working">Đang làm</option>
                  <option value="Resigned">Đã nghỉ</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Loại hình</label>
                <select id="u-emp-kind" class="form-select">
                  <option value="Fulltime">Fulltime</option>
                  <option value="Parttime">Parttime</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" id="btn-save-user"><i class="bi bi-check-lg me-1"></i>Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Period Modal -->
  <div class="modal fade" id="modal-period" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content glass-modal">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-period-title">Tạo kỳ đăng ký</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-period">
            <input type="hidden" id="period-id" />
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label">Tháng *</label>
                <select id="p-month" class="form-select">
                  <option value="1">Tháng 1</option>
                  <option value="2">Tháng 2</option>
                  <option value="3">Tháng 3</option>
                  <option value="4">Tháng 4</option>
                  <option value="5">Tháng 5</option>
                  <option value="6">Tháng 6</option>
                  <option value="7">Tháng 7</option>
                  <option value="8">Tháng 8</option>
                  <option value="9">Tháng 9</option>
                  <option value="10">Tháng 10</option>
                  <option value="11">Tháng 11</option>
                  <option value="12">Tháng 12</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">Năm *</label>
                <input id="p-year" type="number" class="form-control" value="2025" min="2020" max="2099" />
              </div>
              <div class="col-12">
                <label class="form-label">Ngày mở</label>
                <input id="p-open" type="datetime-local" class="form-control" />
              </div>
              <div class="col-12">
                <label class="form-label">Ngày đóng</label>
                <input id="p-close" type="datetime-local" class="form-control" />
              </div>
              <div class="col-12">
                <label class="form-label">Trạng thái</label>
                <select id="p-status" class="form-select">
                  <option value="open">Mở</option>
                  <option value="closed">Đóng</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" id="btn-save-period"><i class="bi bi-check-lg me-1"></i>Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="app-toast" class="toast align-items-center border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toast-msg"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/pages.js?v=1.5"></script>
  <script src="static/page_users.js?v=1.5"></script>
  <script src="static/page_periods.js?v=1.5"></script>
  <script src="static/page_admin_schedule.js?v=1.5"></script>
  <script src="static/page_profile.js?v=1.5"></script>
  <script src="static/page_schedule.js?v=1.5"></script>
  <script src="static/page_accounts.js?v=1.5"></script>
  <script src="static/app.js?v=1.5"></script>
</body>

</html>
